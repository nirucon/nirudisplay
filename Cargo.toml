[package]
name = "nirudisplay"
version = "0.1.2"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Graphical monitor settings for the NIRUX desktop"

[dependencies]
x11rb = { version = "0.13", features = ["randr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ab_glyph = "0.2"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
